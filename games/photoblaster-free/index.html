<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://cdn1.kongregate.com/javascripts/kongregate_api.js"></script>

<script>
    var kongregate = null;

    function loadKongregateAPI() {
        if (!window.kongregateAPI) {
            console.log("Not running on Kongregate");
            return;
        }

        window.kongregateAPI.loadAPI({
            onload: function () {
                kongregate = window.kongregateAPI.getAPI();
                kongregate.services.connect();
                console.log("Kongregate API loaded");
            }
        });
    }

    window.addEventListener("load", loadKongregateAPI);
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Photo Blaster</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#000; overflow:hidden; }

  #camVideo {
    position:fixed; top:0; left:0; width:100%; height:100%;
    object-fit:cover; z-index:1; display:none;
  }
  #camVideo.visible { display:block; }

  canvas {
    position:fixed; top:0; left:0; width:100%; height:100%; display:block;
  }
  #photoCanvas    { z-index:2; display:none; }
  #photoCanvas.visible { display:block; }
  #damageCanvas   { z-index:3; pointer-events:none; }
  #gasCanvas      { z-index:4; pointer-events:none; }   /* gas wet layer */
  #fireCanvas     { z-index:5; pointer-events:none; }   /* fire animation frames */
  #particleCanvas { z-index:6; pointer-events:none; }
  #hitCanvas      { z-index:7; cursor:crosshair; display:none; }
  #hitCanvas.visible { display:block; }

  /* ── TITLE SCREEN ─────────────────────────────────────────── */
  #titleScreen {
    position:fixed; inset:0; z-index:30; background:#000;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none;
  }
  #titleScreen.gone { display:none; }
  #titleImg {
    max-width:90%; max-height:90%; width:auto; height:auto; object-fit:contain;
    animation: titleFadeIn 0.5s ease forwards;
  }
  @keyframes titleFadeIn { from{opacity:0} to{opacity:1} }

  /* ── CAMERA PERMISSION OVERLAY ────────────────────────────── */
  #startScreen {
    position:fixed; inset:0; z-index:20; background:#000;
    display:flex; align-items:center; justify-content:center;
    font-size:80px; cursor:pointer; user-select:none;
  }
  #startScreen.gone { display:none; }

  /* ── HUD ──────────────────────────────────────────────────── */
  #hud {
    position:fixed; bottom:22px; left:50%;
    transform:translateX(-50%);
    display:flex; gap:16px; z-index:25;
  }
  .hbtn {
    width:58px; height:58px; border-radius:50%;
    border:2px solid rgba(255,255,255,0.25);
    background:rgba(0,0,0,0.65);
    font-size:26px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 18px rgba(0,0,0,0.7);
    transition:transform 0.1s;
    user-select:none; -webkit-user-select:none;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  .hbtn:active   { transform:scale(0.85); }
  .hbtn:disabled { opacity:0.25; cursor:default; }

  /* ── CROSSHAIR ────────────────────────────────────────────── */
  #crosshairImg {
    position:fixed; pointer-events:none; z-index:24;
    width:64px; height:64px;
    transform:translate(-50%,-50%);
    display:none;
    image-rendering:pixelated;
  }
  #crosshairImg.active { display:block; }

  /* ── PAUSE OVERLAY ────────────────────────────────────────── */
  .overlay-panel {
    position:fixed; inset:0; z-index:40;
    background:rgba(0,0,0,0.6);
    display:flex; align-items:center; justify-content:center;
  }
  .overlay-card {
    background:#1a1a1a; border:1px solid rgba(255,255,255,0.15);
    border-radius:14px; padding:24px 28px; min-width:220px;
    display:flex; flex-direction:column; gap:12px;
  }
  .overlay-title {
    color:#fff; font-size:20px; text-align:center; margin-bottom:6px;
    font-family:sans-serif;
  }
  .overlay-btn {
    background:rgba(255,255,255,0.1); color:#fff;
    border:1px solid rgba(255,255,255,0.25); border-radius:8px;
    padding:12px; font-size:16px; cursor:pointer; font-family:sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .overlay-btn:active { transform:scale(0.97); }

  /* ── TUTORIAL TIP ─────────────────────────────────────────── */
  .tip-bubble {
    position:fixed; z-index:41; max-width:250px;
    background:#fff; color:#111; border-radius:12px; padding:12px 14px;
    box-shadow:0 4px 20px rgba(0,0,0,0.5);
    font-family:sans-serif; font-size:14px; line-height:1.4; text-align:center;
  }
  .tip-dismiss {
    display:block; margin:8px auto 0; background:#111; color:#fff;
    border:none; border-radius:6px; padding:6px 14px; font-size:13px;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
</style>

<script>
// ════════════════════════════════════════════════════════════════
// PHOTO BLASTER 5.0 — Revised
// Manifest-driven. Edit photo_blastermanifest.txt to adjust
// all asset paths, volumes, timings, and gameplay values.
// ════════════════════════════════════════════════════════════════

// ── MANIFEST PARSER ──────────────────────────────────────────
var CFG = {};
var ASSETS = "sound_and_images/";
// Cache-bust suffix appended to every image/audio load so edits appear immediately
var CB = "?v=" + Date.now();

// Bust a path — add CB unless it already has a query string
function bust(path) { return path && path.indexOf("?") < 0 ? path + CB : path; }

function parseManifest(text) {
  var lines = text.split(/\r?\n/);
  var section = "GLOBAL";
  var lastKey = null;
  CFG = {};
  for (var i = 0; i < lines.length; i++) {
    var raw = lines[i];
    if (/^\s*#/.test(raw) || /^\s*$/.test(raw)) { lastKey=null; continue; }
    var secMatch = raw.match(/^\[([^\]]+)\]/);
    if (secMatch) { section = secMatch[1].trim(); CFG[section]=CFG[section]||{}; lastKey=null; continue; }
    if (/^\s+/.test(raw) && lastKey) { CFG[section][lastKey] += " " + raw.trim(); continue; }
    var eqIdx = raw.indexOf("=");
    if (eqIdx < 0) continue;
    var k = raw.slice(0, eqIdx).trim();
    var v = raw.slice(eqIdx + 1).trim();
    CFG[section] = CFG[section] || {};
    CFG[section][k] = v;
    lastKey = k;
  }
}

function cfgNum(section, key, def) {
  var v = CFG[section] && CFG[section][key];
  if (v === undefined || v === "") return def;
  var n = parseFloat(v);
  return isNaN(n) ? def : n;
}
function cfgStr(section, key, def) {
  var v = CFG[section] && CFG[section][key];
  return (v !== undefined && v !== "") ? v.trim() : def;
}
function cfgAsset(section, key, def) {
  var v = cfgStr(section, key, def);
  if (!v) return "";
  if (v.indexOf("/") >= 0) return v;
  return ASSETS + v;
}

// ── AUDIO SYSTEM ─────────────────────────────────────────────
var ac = null;
var SOUND_CACHE = {};

function getAC() {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === "suspended") ac.resume();
  return ac;
}

function playSound(path, volume, loop) {
  if (!path || soundMuted) return null;
  volume = (volume === undefined) ? 1.0 : volume;
  loop   = loop || false;
  var a = getAC();
  var nodeRef = { src: null };
  var cacheKey = path;   // stable key (no bust) so cache hits work
  var fetchPath = bust(path);  // busted for actual fetch

  function _play(buf) {
    var src = a.createBufferSource();
    src.buffer = buf; src.loop = loop;
    var g = a.createGain(); g.gain.value = volume;
    src.connect(g); g.connect(a.destination);
    src.start();
    nodeRef.src = src;
    return src;
  }

  if (SOUND_CACHE[cacheKey]) { _play(SOUND_CACHE[cacheKey]); return nodeRef; }
  fetch(fetchPath)
    .then(function(r){ return r.arrayBuffer(); })
    .then(function(ab){ return a.decodeAudioData(ab); })
    .then(function(buf){ SOUND_CACHE[cacheKey]=buf; _play(buf); })
    .catch(function(e){ console.warn("Sound load failed:", fetchPath, e); });
  return nodeRef;
}

// Procedural audio fallbacks
function noise(dur, gainVal, loFreq, hiFreq) {
  if (soundMuted) return;
  var a=getAC(), len=a.sampleRate*dur|0, buf=a.createBuffer(1,len,a.sampleRate);
  var d=buf.getChannelData(0); for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
  var src=a.createBufferSource(); src.buffer=buf;
  var lo=a.createBiquadFilter(); lo.type="lowpass";  lo.frequency.value=hiFreq;
  var hi=a.createBiquadFilter(); hi.type="highpass"; hi.frequency.value=loFreq;
  var g=a.createGain();
  g.gain.setValueAtTime(gainVal,a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
  src.connect(hi); hi.connect(lo); lo.connect(g); g.connect(a.destination);
  src.start(); src.stop(a.currentTime+dur);
}
function tone(freq,endFreq,dur,type,gainVal){
  if (soundMuted) return;
  var a=getAC(),o=a.createOscillator(); o.type=type;
  o.frequency.setValueAtTime(freq,a.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(endFreq,20),a.currentTime+dur);
  var g=a.createGain();
  g.gain.setValueAtTime(gainVal,a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur);
}
function boom(subFreq,dur,gainVal){
  if (soundMuted) return;
  var a=getAC();
  var sub=a.createOscillator(); sub.type="sine";
  sub.frequency.setValueAtTime(subFreq,a.currentTime);
  sub.frequency.exponentialRampToValueAtTime(20,a.currentTime+dur*0.7);
  var len=a.sampleRate*dur|0, buf=a.createBuffer(1,len,a.sampleRate);
  var d=buf.getChannelData(0); for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
  var nsrc=a.createBufferSource(); nsrc.buffer=buf;
  var nf=a.createBiquadFilter(); nf.type="bandpass"; nf.frequency.setValueAtTime(180,a.currentTime);
  nf.frequency.exponentialRampToValueAtTime(40,a.currentTime+dur); nf.Q.value=0.7;
  var ws=a.createWaveShaper();
  var curve=new Float32Array(512);
  for(var i=0;i<512;i++){var x=i*2/512-1;curve[i]=(Math.PI+400)*x/(Math.PI+400*Math.abs(x));}
  ws.curve=curve;
  var gS=a.createGain(); gS.gain.setValueAtTime(gainVal*0.9,a.currentTime); gS.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
  var gN=a.createGain(); gN.gain.setValueAtTime(gainVal*0.6,a.currentTime); gN.gain.linearRampToValueAtTime(0,a.currentTime+dur*0.5);
  sub.connect(ws); ws.connect(gS); gS.connect(a.destination);
  nsrc.connect(nf); nf.connect(gN); gN.connect(a.destination);
  sub.start(); sub.stop(a.currentTime+dur);
  nsrc.start(); nsrc.stop(a.currentTime+dur);
}
function clack(pitch){ tone(pitch*1.5,pitch*0.4,0.06,"square",0.3); noise(0.05,0.25,800,5000); setTimeout(function(){noise(0.04,0.2,600,4000);tone(pitch*0.8,pitch*0.2,0.05,"square",0.2);},80); }
function clink(){ tone(1200+Math.random()*400,400,0.08,"sine",0.12); }
function crackle(dur){ noise(dur,0.3,200,1200); for(var i=0;i<3;i++)(function(t){setTimeout(function(){noise(0.04,0.2+Math.random()*0.2,400,2500);},t);})(Math.random()*dur*900); }

// ── DOM REFERENCES ───────────────────────────────────────────
var camVideo     = document.getElementById("camVideo");
var photoCvs     = document.getElementById("photoCanvas");
var dmgCvs       = document.getElementById("damageCanvas");
var gasCvs       = document.getElementById("gasCanvas");
var fireCvs      = document.getElementById("fireCanvas");
var ptCvs        = document.getElementById("particleCanvas");
var hitCvs       = document.getElementById("hitCanvas");
var titleScreen  = document.getElementById("titleScreen");
var startScreen  = document.getElementById("startScreen");
var btnSnap      = document.getElementById("btnSnap");
var btnWeapon    = document.getElementById("btnWeapon");
var btnPause     = document.getElementById("btnPause");
var btnSound     = document.getElementById("btnSound");
var pauseOverlay = document.getElementById("pauseOverlay");
var tutorialTip     = document.getElementById("tutorialTip");
var tutorialTipText = document.getElementById("tutorialTipText");
var tutorialTipDismiss = document.getElementById("tutorialTipDismiss");
var crosshairImg = document.getElementById("crosshairImg");
var hud          = document.getElementById("hud");

var pCtx  = photoCvs.getContext("2d");
var dCtx  = dmgCvs.getContext("2d");
var gCtx  = gasCvs.getContext("2d");
var fCtx  = fireCvs.getContext("2d");
var ptCtx = ptCvs.getContext("2d");

// ── TITLE MUSIC ───────────────────────────────────────────────
// Music is decoded as soon as the manifest loads, held in a buffer.
// It starts playing the moment the user first taps (AC unlock).
var titleMusicSrc  = null;
var titleMusicBuf  = null;   // pre-decoded buffer, ready to play

function preloadTitleMusic(onReady) {
  var path = cfgStr("TITLE","music","") || "00-title-music.wav";
  path = (path.indexOf("/") >= 0) ? path : ASSETS + path;
  path = bust(path);
  fetch(path)
    .then(function(r){ return r.arrayBuffer(); })
    .then(function(ab){
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      return ctx.decodeAudioData(ab);
    })
    .then(function(buf){
      titleMusicBuf = buf;
      if (onReady) onReady();
    })
    .catch(function(e){ console.warn("Title music preload failed:", path, e); });
}

function startTitleMusic() {
  if (titleMusicSrc) return;   // already playing
  var vol  = cfgNum("TITLE","music_volume",0.55);
  var loop = cfgStr("TITLE","music_loop","true") === "true";
  var a = getAC();

  function _play(buf) {
    var src = a.createBufferSource();
    src.buffer = buf; src.loop = loop;
    var g = a.createGain(); g.gain.value = soundMuted ? 0 : vol;
    src.connect(g); g.connect(a.destination);
    src.start();
    titleMusicSrc = { src:src, gain:g };
  }

  if (titleMusicBuf) {
    _play(titleMusicBuf);
    return;
  }
  // Buffer not ready yet — fetch+decode now (first-tap AC is active)
  var path2 = cfgStr("TITLE","music","") || "00-title-music.wav";
  path2 = (path2.indexOf("/") >= 0) ? path2 : ASSETS + path2;
  path2 = bust(path2);
  fetch(path2)
    .then(function(r){ return r.arrayBuffer(); })
    .then(function(ab){ return a.decodeAudioData(ab); })
    .then(function(buf){ titleMusicBuf=buf; _play(buf); })
    .catch(function(e){ console.warn("Title music load failed:", path2, e); });
}

function stopTitleMusic() {
  if (!titleMusicSrc) return;
  var fadeOut = cfgNum("TITLE","fade_out",0.5);
  var g = titleMusicSrc.gain;
  var a = getAC();
  g.gain.setValueAtTime(g.gain.value, a.currentTime);
  g.gain.linearRampToValueAtTime(0, a.currentTime + fadeOut);
  var s = titleMusicSrc.src;
  titleMusicSrc = null;
  setTimeout(function(){ try{s.stop();}catch(e){} }, (fadeOut+0.1)*1000);
}

// ── SOUND MUTE TOGGLE ─────────────────────────────────────────
var soundMuted = (localStorage.getItem("pb_soundMuted") === "1");

function updateSoundIcon() {
  btnSound.innerHTML = soundMuted
    ? '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="28" height="28"><path d="M6 14 H12 L20 7 V29 L12 22 H6 Z" fill="#fff"/><line x1="24" y1="12" x2="32" y2="24" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><line x1="32" y1="12" x2="24" y2="24" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>'
    : '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="28" height="28"><path d="M6 14 H12 L20 7 V29 L12 22 H6 Z" fill="#fff"/><path d="M24 12 Q28 18 24 24" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M27 8 Q34 18 27 28" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/></svg>';
}

function toggleSound() {
  soundMuted = !soundMuted;
  localStorage.setItem("pb_soundMuted", soundMuted ? "1" : "0");
  if (titleMusicSrc && titleMusicSrc.gain) {
    var vol = cfgNum("TITLE","music_volume",0.55);
    titleMusicSrc.gain.gain.value = soundMuted ? 0 : vol;
  }
  updateSoundIcon();
}

btnSound.addEventListener("click", function(e){ e.stopPropagation(); toggleSound(); });
btnSound.addEventListener("touchend", function(e){ e.preventDefault(); e.stopPropagation(); toggleSound(); }, {passive:false});
updateSoundIcon();

// ── FIRE FRAME ANIMATION ─────────────────────────────────────
// Loaded from manifest [FIRE_SEQUENCE] fire_frames = img1, img2, img3
var fireFrameImgs = [];
var fireFrameTime = 60;   // ms per frame
var fireFrameIdx  = 0;
var fireFrameTimer = 0;
var FIRE_TILES = [];  // {col, row, intensity, size} — active fire tiles to draw with frames

function loadFireFrames() {
  // Read from manifest if present, else fall back to known exact filenames
  var raw = cfgStr("FIRE_SEQUENCE","fire_frames","");
  var names;
  if (raw) {
    names = raw.split(",").map(function(s){ return s.trim(); });
  } else {
    names = ["00-fire-frame-01.png","00-fire-frame-02.png","00-fire-frame-03.png"];
  }
  fireFrameTime = cfgNum("FIRE_SEQUENCE","fire_frame_time",0.06) * 1000;
  fireFrameImgs = [];
  names.forEach(function(n){
    if (!n) return;
    var img = new Image();
    img.src = bust((n.indexOf("/") >= 0) ? n : ASSETS + n);
    fireFrameImgs.push(img);
  });
}

// ── WEAPON SYSTEM ─────────────────────────────────────────────
var WPS  = [];
var wIdx = 0;

function buildWeapons() {
  // Helper: read a manifest asset, fall back to a known-good filename
  function A(sec, key, fallback) {
    var v = cfgStr(sec, key, "");
    if (v) return ASSETS + v;
    return fallback ? ASSETS + fallback : "";
  }

  // 01 – SNIPER
  // Manifest keys: bang=01-sniper_bang.wav, reload=01-sniper_reload.wav
  // reports: report_flesh/metal/paper/misc → 01-sniper-report-*.wav
  WPS.push({
    id:"sniper", label:"Sniper",
    crosshair:  A("WEAPON_01_SNIPER","crosshair","01-sniper-crosshair.png"),
    bang:       A("WEAPON_01_SNIPER","bang","01-sniper_bang.wav"),
    reload:     A("WEAPON_01_SNIPER","reload","01-sniper_reload.wav"),
    reports: {
      flesh: A("WEAPON_01_SNIPER","report_flesh","01-sniper-report-flesh.wav"),
      metal: A("WEAPON_01_SNIPER","report_metal","01-sniper-report-metal.wav"),
      paper: A("WEAPON_01_SNIPER","report_paper","01-sniper-report-paper.wav"),
      misc:  A("WEAPON_01_SNIPER","report_misc", "01-sniper-report-misc.wav")
    },
    bangVol:    cfgNum("WEAPON_01_SNIPER","bang_volume",1.0),
    reportVol:  cfgNum("WEAPON_01_SNIPER","report_volume",0.85),
    reloadVol:  cfgNum("WEAPON_01_SNIPER","reload_volume",0.7),
    delayDamage:cfgNum("WEAPON_01_SNIPER","delay_bang_to_damage",0.02)*1000,
    delayReport:cfgNum("WEAPON_01_SNIPER","delay_bang_to_report",0.06)*1000,
    delayReload:cfgNum("WEAPON_01_SNIPER","delay_report_to_reload",0.25)*1000,
    strength:   cfgNum("WEAPON_01_SNIPER","strength",1.0),
    rimCrack:   cfgNum("WEAPON_01_SNIPER","rim_crack_chance",0.35),
    fireRate:   1400,
    canFire:false, canShatter:false, spray:0,
    gasIgnite:  cfgNum("BULLET_GAS_IGNITE","sniper",0.35),
    dmg:10.92, rad:0.8
  });

  // 02 – SHOTGUN (slugs, dual barrel, reload after 2nd shot)
  var sgBang = A("WEAPON_02_SHOTGUN","bang","02-shotgun-bang.wav");
  WPS.push({
    id:"shotgun", label:"Shotgun",
    crosshair:  A("WEAPON_02_SHOTGUN","crosshair","02-shotgun-crosshair.png"),
    bang1:      sgBang, bang2: sgBang, bang: sgBang,
    reload:     A("WEAPON_02_SHOTGUN","reload","02-shotgun-reload.wav"),
    reports: {
      flesh: A("WEAPON_02_SHOTGUN","report_flesh","02-shotgun-report-flesh.wav"),
      metal: A("WEAPON_02_SHOTGUN","report_metal","02-shotgun-report-metal.wav"),
      paper: A("WEAPON_02_SHOTGUN","report_paper","02-shotgun-report-paper.wav"),

// ── MATERIAL DETECTION ───────────────────────────────────────
var MAT_FLESH=1, MAT_METAL=2, MAT_PAPER=3, MAT_MISC=0;
var MAT_VOID=99;

var RESIST = {
  flesh_fire:0, flesh_crack:0,
  metal_fire:0, metal_crack:0,
  paper_fire:0, paper_crack:0,
  misc_fire:0,  misc_crack:0
};

function loadResistances() {
  RESIST.flesh_fire  = cfgNum("MATERIALS","flesh_resist_fire",0.1);
  RESIST.flesh_crack = cfgNum("MATERIALS","flesh_resist_crack",0.1);
  RESIST.metal_fire  = cfgNum("MATERIALS","metal_resist_fire",0.9);
  RESIST.metal_crack = cfgNum("MATERIALS","metal_resist_crack",0.9);
  RESIST.paper_fire  = cfgNum("MATERIALS","paper_resist_fire",0.2);
  RESIST.paper_crack = cfgNum("MATERIALS","paper_resist_crack",0.3);
  RESIST.misc_fire   = cfgNum("MATERIALS","misc_resist_fire",0.4);
  RESIST.misc_crack  = cfgNum("MATERIALS","misc_resist_crack",0.4);
}

function classifyPixel(r, g, b) {
  // Void detection — near-black pixels
  if (r < 18 && g < 18 && b < 18) return MAT_VOID;
  var brightness = (r+g+b)/3;
  if (brightness > 210 && Math.abs(r-g)<20 && Math.abs(g-b)<20) return MAT_PAPER;
  var maxC=Math.max(r,g,b), minC=Math.min(r,g,b), sat=maxC-minC;
  if (sat < 30 && brightness > 100) return MAT_METAL;
  if (r > 140 && g > 80 && g < 180 && b < 130 && r-b > 40) return MAT_FLESH;
  return MAT_MISC;
}

function getResist(mat, type) {
  if (mat===MAT_FLESH) return type==="fire" ? RESIST.flesh_fire  : RESIST.flesh_crack;
  if (mat===MAT_METAL) return type==="fire" ? RESIST.metal_fire  : RESIST.metal_crack;
  if (mat===MAT_PAPER) return type==="fire" ? RESIST.paper_fire  : RESIST.paper_crack;
  return type==="fire" ? RESIST.misc_fire : RESIST.misc_crack;
}

// ── PHOTO → CANVAS ───────────────────────────────────────────
function drawPhoto(){
  var sx=W/photoImg.width, sy=H/photoImg.height, sc=Math.min(sx,sy);
  pw=Math.floor(photoImg.width*sc); ph=Math.floor(photoImg.height*sc);
  ox=Math.floor((W-pw)/2); oy=Math.floor((H-ph)/2);
  pCtx.fillStyle="#000"; pCtx.fillRect(0,0,W,H);
  pCtx.drawImage(photoImg,ox,oy,pw,ph);
}

function buildGrid(){
  COLS=Math.ceil(pw/BLOCK); ROWS=Math.ceil(ph/BLOCK);
  pixHP   = new Float32Array(COLS*ROWS).fill(MAX_HP);
  pixFire = new Float32Array(COLS*ROWS).fill(0);
  pixGas  = new Float32Array(COLS*ROWS).fill(0);
  pixBurnout = new Float32Array(COLS*ROWS).fill(0);
  pxR=new Uint8ClampedArray(COLS*ROWS);
  pxG=new Uint8ClampedArray(COLS*ROWS);
  pxB=new Uint8ClampedArray(COLS*ROWS);
  pxMat=new Uint8ClampedArray(COLS*ROWS);
  var raw=pCtx.getImageData(ox,oy,pw,ph).data;
  for(var row=0;row<ROWS;row++) for(var col=0;col<COLS;col++){
    var idx=row*COLS+col,r=0,g=0,b=0,n=0;
    for(var py=0;py<BLOCK;py++) for(var px2=0;px2<BLOCK;px2++){
      var sx2=col*BLOCK+px2, sy2=row*BLOCK+py;
      if(sx2>=pw||sy2>=ph) continue;
      var pi=(sy2*pw+sx2)*4; r+=raw[pi];g+=raw[pi+1];b+=raw[pi+2];n++;
    }
    if(n){
      pxR[idx]=r/n|0; pxG[idx]=g/n|0; pxB[idx]=b/n|0;
      pxMat[idx]=classifyPixel(r/n|0,g/n|0,b/n|0);
    }
  }
  dCtx.clearRect(0,0,W,H);
  gCtx.clearRect(0,0,W,H);
  holeCtx.clearRect(0,0,W,H);
  if (pixBurnout) pixBurnout.fill(0);
  FIRE_TILES = [];
}

// ── ERASE single decal tile (called whenever a tile's HP hits 0) ──
function eraseDecalTile(col, row) {
  if (!holeCtx) return;
  holeCtx.save();
  holeCtx.globalCompositeOperation = "destination-out";
  holeCtx.fillStyle = "rgba(0,0,0,1)";
  holeCtx.fillRect(ox + col*BLOCK, oy + row*BLOCK, BLOCK, BLOCK);
  holeCtx.restore();
}

// Draw bullet-hole damage — black circle + rim + blood stamped onto holeCanvas.
function stampBulletHole(cx, cy, mat, radius, weaponId) {
  if (!holeCtx) return;
  if (mat === MAT_VOID) return;   // never stamp on void
  var r = radius || BLOCK * 1.4;
  var isSniper = (weaponId === "sniper");
  var rimMult = isSniper ? 2.0 : 1.0;

  // Black hole centre
  holeCtx.save();
  holeCtx.globalCompositeOperation = "source-over";
  holeCtx.fillStyle = "#000";
  holeCtx.beginPath();
  holeCtx.arc(cx, cy, r * 0.62, 0, Math.PI*2);
  holeCtx.fill();
  holeCtx.restore();

  // Rim segments
  if (rimImg) {
    var rimSize = r * 2.8 * rimMult;
    holeCtx.save();
    holeCtx.translate(cx, cy);
    for (var i=0; i<8; i++) {
      holeCtx.save();
      holeCtx.rotate(i * Math.PI/4);
      holeCtx.globalAlpha = 0.65;
      holeCtx.drawImage(rimImg, -rimSize/2, -rimSize/2, rimSize, rimSize);
      holeCtx.restore();
    }
    holeCtx.restore();
  }

  // Blood splatter (flesh only)
  if (bloodImg && mat === MAT_FLESH) {
    var bsegs = parseInt(cfgStr("BLOOD_VISUALS","blood_segments","5")) || 5;
    var bstep = cfgNum("BLOOD_VISUALS","blood_rotation_step",72);
    var bSize = r * 7.5 * (isSniper ? 2.0 : 1.0);
    holeCtx.save();
    holeCtx.translate(cx, cy);
    holeCtx.rotate(Math.random()*Math.PI*2);
    for (var j=0; j<bsegs; j++) {
      holeCtx.save();
      holeCtx.rotate((j*bstep*Math.PI)/180);
      holeCtx.globalAlpha = 0.72 + Math.random()*0.25;
      holeCtx.drawImage(bloodImg, -bSize/2, -bSize/2, bSize, bSize);
      holeCtx.restore();
    }
    holeCtx.restore();
  }
}

// Erase hole/blood decals over void/dead tiles within a radius around cx,cy.
// Much faster than scanning the whole grid — only checks tiles the decal could cover.
function eraseDecalsNear(cx, cy, radiusPx) {
  if (!holeCtx || !pixHP) return;
  var pad = radiusPx + BLOCK;
  // tile range that the decal (including blood splatter at ~4x radius) could reach
  var c0 = Math.max(0, Math.floor((cx - pad*4 - ox) / BLOCK));
  var c1 = Math.min(COLS-1, Math.ceil((cx + pad*4 - ox) / BLOCK));
  var r0 = Math.max(0, Math.floor((cy - pad*4 - oy) / BLOCK));
  var r1 = Math.min(ROWS-1, Math.ceil((cy + pad*4 - oy) / BLOCK));
  holeCtx.save();
  holeCtx.globalCompositeOperation = "destination-out";
  holeCtx.fillStyle = "rgba(0,0,0,1)";
  for (var row=r0; row<=r1; row++) for (var col=c0; col<=c1; col++) {
    var idx = row*COLS+col;
    if (pixHP[idx]<=0 || pxMat[idx]===MAT_VOID) {
      holeCtx.fillRect(ox+col*BLOCK, oy+row*BLOCK, BLOCK, BLOCK);
    }
  }
  holeCtx.restore();
}

// Legacy full-grid version — kept for collapse/shatter events only
function eraseDecalsOverVoid() {
  if (!holeCtx || !pixHP) return;
  holeCtx.save();
  holeCtx.globalCompositeOperation = "destination-out";
  holeCtx.fillStyle = "rgba(0,0,0,1)";
  for (var row=0; row<ROWS; row++) for (var col=0; col<COLS; col++) {
    var idx = row*COLS+col;
    if (pixHP[idx]<=0 || pxMat[idx]===MAT_VOID) {
      holeCtx.fillRect(ox+col*BLOCK, oy+row*BLOCK, BLOCK, BLOCK);
    }
  }
  holeCtx.restore();
}

// ── FLESH DAMAGE AUDIO ────────────────────────────────────────
// Plays the manifest flesh-damage wav on any flesh-material hit.
var fleshDmgSound = "";
var fleshDmgVol   = 0.7;
var weaponSwapSound = "";
var lastFleshHitTime = 0;
var FLESH_HIT_MIN_INTERVAL = 180; // ms minimum between flesh hit sounds
function playFleshHit() {
  var now = Date.now();
  if (now - lastFleshHitTime < FLESH_HIT_MIN_INTERVAL) return;
  lastFleshHitTime = now;
  playSound(fleshDmgSound, fleshDmgVol);
}

// ── MACHINE GUN DRIFT ────────────────────────────────────────
// Accuracy degrades with sustained fire, resets on trigger release.
var mgShotCount  = 0;   // shots fired in current burst
var mgDriftMax   = 8.0; // max drift in tiles at worst accuracy
var mgDriftDecay = 0;   // reset timer
var mgLastFireTime = 0; // track last fire for pause detection
var MG_PAUSE_RESET_MS = 400; // pause longer than this resets accuracy

function mgDrift() {
  // First shot is accurate, drift grows with each subsequent shot
  if (mgShotCount === 0) { mgShotCount++; return { dx:0, dy:0 }; }
  var d = Math.min(mgShotCount * 0.35, mgDriftMax);
  mgShotCount++;
  return { dx: (Math.random()-0.5)*d, dy: (Math.random()-0.5)*d };
}

function resetMgDrift() {
  mgShotCount = 0;
  mgLastFireTime = 0;
}

// ── AUDIO ─────────────────────────────────────────────────────
function getReport(w, mat) {
  if (!w.reports) return "";
  return mat===MAT_FLESH ? w.reports.flesh :
         mat===MAT_METAL ? w.reports.metal :
         mat===MAT_PAPER ? w.reports.paper : w.reports.misc;
}

function doAudio(w, mat) {
  if (w.id==="sniper") {
    // Sniper: bang immediately, report after delayReport, reload after delayReport+delayReload
    playSound(w.bang, w.bangVol);
    setTimeout(function(){
      playSound(getReport(w, mat), w.reportVol);
    }, w.delayReport||60);
    setTimeout(function(){
      playSound(w.reload, w.reloadVol);
    }, (w.delayReport||60) + (w.delayReload||250) + 600);

  } else if (w.id==="shotgun") {
    // Handled inline in shoot()

  } else if (w.id==="rpg") {
    // Handled inline in shoot()

  } else if (w.id==="machinegun") {
    // Handled inline in shoot()

  } else if (w.id==="gascan") {
    playSound(w.dump, w.dumpVol);

  } else if (w.id==="lookingglass") {
    // Silent

  } else if (w.id==="flamethrower") {
    // Rate-limit the bang sound — only play once per 120ms to prevent distortion
    var ftNow = Date.now();
    if (!w._lastBang || ftNow - w._lastBang > 120) {
      playSound(w.bang, w.bangVol);
      w._lastBang = ftNow;
    }
    // No flesh hit for flamethrower — fire tick handles that separately
  }
}

function soundFireSpread(){
  if(Math.random()<0.4) crackle(0.08);
}

// ── SHOOT ─────────────────────────────────────────────────────
function getPos(e){
  var rect=hitCvs.getBoundingClientRect();
  if(e.touches) return {x:e.touches[0].clientX-rect.left,y:e.touches[0].clientY-rect.top};
  return {x:e.clientX-rect.left,y:e.clientY-rect.top};
}

function shoot(sx,sy){
  if(!gameOn||!pixHP) return;
  var now=Date.now(), w=wp();
  var effectiveRate = w.id==="flamethrower" ? ftCurrentRate : w.fireRate;
  if(now-lastShot < effectiveRate) return;
  if(w.id==="shotgun"   && sgReloading)     return;
  if(w.id==="sniper"    && sniperReloading) return;
  if(w.id==="rpg"       && rpgReloading)    return;
  lastShot=now;

  var tx=(sx-ox)/BLOCK, ty=(sy-oy)/BLOCK;
  var hc=Math.floor(tx), hr=Math.floor(ty);

  // ── VOID HIT CHECK — complete miss, no sounds, no effects ──
  var isVoidHit = (sx < ox || sx > ox+pw || sy < oy || sy > oy+ph);
  if (!isVoidHit && hc>=0&&hc<COLS&&hr>=0&&hr<ROWS) {
    var chkIdx = hr*COLS+hc;
    if (pxMat[chkIdx] === MAT_VOID || pixHP[chkIdx] <= 0) isVoidHit = true;
  }
  if (isVoidHit) return;

  var hitMat = MAT_MISC;
  if (hc>=0&&hc<COLS&&hr>=0&&hr<ROWS) hitMat=pxMat[hr*COLS+hc]||MAT_MISC;

  if (w.id==="shotgun") {
    // Barrel 0 = RIGHT of centre (+2.5 tiles), Barrel 1 = LEFT (-2.5 tiles)
    var slugOffset = (sgBarrel===0) ? 2.5 : -2.5;
    var stx = tx + slugOffset;

    // Re-check void at actual slug landing position
    var shc=Math.floor(stx), shr=Math.floor(ty);
    var slugMat = MAT_MISC;
    if(shc>=0&&shc<COLS&&shr>=0&&shr<ROWS) slugMat=pxMat[shr*COLS+shc]||MAT_MISC;
    var slugVoid = (slugMat===MAT_VOID);

    // Per-barrel bang wav
    var bangSound = sgBarrel===0 ? (w.bang1||w.bang) : (w.bang2||w.bang);
    playSound(bangSound, w.bangVol);

    if (!slugVoid) {
      var capStx=stx, capTy2=ty, capSlugMat=slugMat;
      setTimeout(function(){
        applyBullet(capStx, capTy2, w, capSlugMat);
        if (capSlugMat===MAT_FLESH) playFleshHit();
      }, w.delayDamage||30);
    }

    if (sgBarrel===0) {
      sgBarrel=1;
    } else {
      // Both barrels spent → report + reload
      sgBarrel=0;
      sgReloading=true;
      var delRpt = w.delayReport||50;
      setTimeout(function(){
        if (!slugVoid) playSound(getReport(w, slugMat), w.reportVol);
      }, delRpt);
      setTimeout(function(){
        playSound(w.reload, w.reloadVol);
        setTimeout(function(){ sgReloading=false; }, 900);
      }, delRpt + (w.delayReload||400));
    }

  } else if (w.id==="sniper") {
    sniperReloading=true;
    // Bang immediately
    playSound(w.bang, w.bangVol);
    var snapTx=tx, snapTy=ty, snapMat=hitMat;
    // Damage after delayDamage
    setTimeout(function(){
      applyBullet(snapTx, snapTy, w, snapMat);
      if(snapMat===MAT_FLESH) playFleshHit();
    }, w.delayDamage||20);
    // Report after delayReport
    setTimeout(function(){
      playSound(getReport(w, snapMat), w.reportVol);
    }, w.delayReport||60);
    // Reload after delayReport + delayReload
    setTimeout(function(){
      playSound(w.reload, w.reloadVol);
      sniperReloading=false;
    }, (w.delayReport||60) + (w.delayReload||250) + 600);

  } else if (w.id==="rpg") {
    if(Math.random()<w.dudChance){
      playSound(w.reportDud||"", cfgNum("WEAPON_04_RPG","report_volume",1.0));
      rpgReloading=true;
      setTimeout(function(){rpgReloading=false;}, w.fireRate-50);
      return;
    }
    rpgReloading=true;
    playSound(w.bang, w.bangVol);   // launch sound immediately
    var rpgTx=tx, rpgTy=ty, rpgMat=hitMat;
    setTimeout(function(){
      applyDmg(rpgTx,rpgTy,w.rad,w.dmg,w);
      triggerRpgExplosion(ox+rpgTx*BLOCK, oy+rpgTy*BLOCK, w.rad);
      if(w.canShatter&&Math.random()<w.crackChance)
        setTimeout(function(){shatter(rpgTx,rpgTy,w.rad*1.5);},750);
      setTimeout(function(){
        playSound(w.reports.misc, w.reportVol);
        if(rpgMat===MAT_FLESH) playFleshHit();
      }, w.delayReport - (w.delayDamage||40));
      setTimeout(function(){
        playSound(w.reload, w.reloadVol);
      }, w.delayReport - (w.delayDamage||40) + w.delayReload);
    }, w.delayDamage||40);
    setTimeout(function(){rpgReloading=false;}, w.fireRate-50);

  } else if (w.id==="gascan") {
    pourGas(tx, ty, w);
    doAudio(w, hitMat);

  } else if (w.id==="lookingglass") {
    // Tiny focused burn spot — single tile, silent
    var lgc=Math.floor(tx), lgr=Math.floor(ty);
    if(lgc>=0&&lgc<COLS&&lgr>=0&&lgr<ROWS){
      var lgIdx=lgr*COLS+lgc;
      if(pixHP[lgIdx]>0&&pxMat[lgIdx]!==MAT_VOID){
        if(pixFire[lgIdx]===0&&Math.random()<w.igChance)
          pixFire[lgIdx]=0.15+Math.random()*0.2;
      }
    }
    // No sound (spec #11)

  } else if (w.id==="flamethrower") {
    for(var fi2=0;fi2<14;fi2++)
      applyDmg(tx+(Math.random()-0.5)*w.rad*3, ty+(Math.random()-0.5)*w.rad*3, w.rad, w.dmg, w);
    doAudio(w, hitMat);
    if(w.fireRateAccel){
      ftCurrentRate=Math.max(w.fireRateMin, ftCurrentRate-8);
    }

  } else {
    // machinegun — bang fires immediately, damage after delayDamage, report after delayReport
    var nowMs = Date.now();
    if (mgLastFireTime > 0 && nowMs - mgLastFireTime > MG_PAUSE_RESET_MS) {
      mgShotCount = 0;
    }
    mgLastFireTime = nowMs;
    var drift = mgDrift();
    var mtx = tx + drift.dx;
    var mty = ty + drift.dy;
    mtx = Math.max(0, Math.min(COLS-1, mtx));
    mty = Math.max(0, Math.min(ROWS-1, mty));
    var mc=Math.floor(mtx), mr=Math.floor(mty);
    var mMat = (mc>=0&&mc<COLS&&mr>=0&&mr<ROWS) ? (pxMat[mr*COLS+mc]||MAT_MISC) : MAT_MISC;
    // Fire bang sound immediately — rate-limited so it doesn't stack at high fire rates
    var mgBangNow = Date.now();
    if (!w._lastBang || mgBangNow - w._lastBang > 80) {
      playSound(w.bang, w.bangVol);
      w._lastBang = mgBangNow;
    }
    if (mMat !== MAT_VOID) {
      var capMtx=mtx, capMty=mty, capMMat=mMat;
      // Delay damage
      setTimeout(function(){
        applyBullet(capMtx, capMty, w, capMMat);
      }, w.delayDamage||30);
      // Delay report sound after bang
      setTimeout(function(){
        playSound(getReport(w, capMMat), w.reportVol);
        if(capMMat===MAT_FLESH) playFleshHit();
      }, w.delayReport||50);
    }
  }
}

function resetFtRate(){
  ftCurrentRate = wp().id==="flamethrower" ? (wp().fireRateStart||180) : 180;
  resetMgDrift();
}

// ── BULLET IMPACT (single projectile) ────────────────────────
function applyBullet(tx, ty, w, mat) {
  var holeRad = Math.max(2, Math.round(w.rad * BLOCK * 0.85));
  var cx = ox + tx * BLOCK;
  var cy = oy + ty * BLOCK;

  var anyFlesh = false;
  var r0=Math.max(0,Math.floor(ty-w.rad)-1),r1=Math.min(ROWS,Math.ceil(ty+w.rad)+1);
  var c0=Math.max(0,Math.floor(tx-w.rad)-1),c1=Math.min(COLS,Math.ceil(tx+w.rad)+1);
  for (var row=r0;row<r1;row++) for (var col=c0;col<c1;col++){
    var dx=col+0.5-tx, dy=row+0.5-ty, dist=Math.sqrt(dx*dx+dy*dy);
    if (dist>w.rad) continue;
    var idx=row*COLS+col;
    if (pixHP[idx]<=0) continue;
    if (pxMat[idx]===MAT_VOID) continue;
    if (pxMat[idx]===MAT_FLESH) anyFlesh=true;
    var falloff=1-dist/w.rad;
    pixHP[idx] -= w.dmg * falloff * w.strength;
    if (pixHP[idx]<=0) { pixHP[idx]=0; pixFire[idx]=0; eraseDecalTile(col,row); }
    if (pixGas[idx]>0 && Math.random()<w.gasIgnite)
      pixFire[idx]=0.5+Math.random()*0.5;
  }

  // Stamp permanent hole decal
  stampBulletHole(cx, cy, mat, holeRad, w.id);
  // Erase any decal pixels that landed over dead/void tiles — fast radius check only
  eraseDecalsNear(cx, cy, holeRad);

  var safeIdx = Math.max(0, Math.floor(ty)*COLS+Math.floor(tx));
  spawnParts(cx, cy, pxR[safeIdx]||128, pxG[safeIdx]||128, pxB[safeIdx]||128, w.id);
  checkCollapse(Math.floor(tx),Math.floor(ty),4);
}

// ── AREA DAMAGE (RPG / flamethrower) ─────────────────────────
function applyDmg(tx,ty,rad,dmg,w){
  var r0=Math.max(0,Math.floor(ty-rad)-1),r1=Math.min(ROWS,Math.ceil(ty+rad)+1);
  var c0=Math.max(0,Math.floor(tx-rad)-1),c1=Math.min(COLS,Math.ceil(tx+rad)+1);
  var killed=0;
  for(var row=r0;row<r1;row++) for(var col=c0;col<c1;col++){
    var dx=col+0.5-tx, dy=row+0.5-ty, dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>rad) continue;
    var idx=row*COLS+col;
    if(pixHP[idx]<=0) continue;
    if(pxMat[idx]===MAT_VOID) continue;
    var falloff=1-dist/rad;
    var mat=pxMat[idx]||MAT_MISC;
    var fireResist=getResist(mat,"fire");
    if(w&&w.canFire&&pixFire[idx]===0&&Math.random()<(0.4*(1-fireResist)))
      pixFire[idx]=0.3+Math.random()*0.5;
    if(pixGas[idx]>0&&Math.random()<0.6) pixFire[idx]=0.5+Math.random()*0.5;
    pixHP[idx]-=dmg*falloff*(w?w.strength:1);
    if(pixHP[idx]<=0){
      pixHP[idx]=0; killed++; pixFire[idx]=0;
      eraseDecalTile(col, row);
      (function(px2,py2,cr,cg,cb,wid){
        setTimeout(function(){spawnParts(px2,py2,cr,cg,cb,wid);},40+Math.random()*80);
      })(ox+col*BLOCK+BLOCK/2,oy+row*BLOCK+BLOCK/2,pxR[idx],pxG[idx],pxB[idx],w?w.id:"rpg");
    }
  }
  checkCollapse(Math.floor(tx),Math.floor(ty),6);
  return killed;
}

// ── GAS CAN — WET/DARKEN ONLY ────────────────────────────────
function pourGas(tx, ty, w) {
  var rad = w.rad * 3;
  var r0=Math.max(0,Math.floor(ty-rad)-1),r1=Math.min(ROWS,Math.ceil(ty+rad)+1);
  var c0=Math.max(0,Math.floor(tx-rad)-1),c1=Math.min(COLS,Math.ceil(tx+rad)+1);
  // Spray multiple blobs
  for (var blob=0; blob<18; blob++) {
    var btx = tx+(Math.random()-0.5)*rad*2;
    var bty = ty+(Math.random()-0.5)*rad*2;
    var br0=Math.max(0,Math.floor(bty-w.rad)-1),br1=Math.min(ROWS,Math.ceil(bty+w.rad)+1);
    var bc0=Math.max(0,Math.floor(btx-w.rad)-1),bc1=Math.min(COLS,Math.ceil(btx+w.rad)+1);
    for (var row=br0;row<br1;row++) for (var col=bc0;col<bc1;col++){
      var dx=col+0.5-btx, dy=row+0.5-bty, dist=Math.sqrt(dx*dx+dy*dy);
      if (dist>w.rad) continue;
      var idx=row*COLS+col;
      if (pxMat[idx]===MAT_VOID) continue;
      pixGas[idx]=Math.min(1.0, pixGas[idx]+0.35*(1-dist/w.rad));
    }
  }
}

// ── SHATTER ───────────────────────────────────────────────────
function shatter(tx,ty,rad){
  var numRays=8+Math.floor(Math.random()*8);
  for(var r=0;r<numRays;r++){
    var angle=(r/numRays)*Math.PI*2+Math.random()*0.3;
    var len=rad*(0.5+Math.random()*0.8);
    (function(ang,rayLen){
      for(var step=0;step<rayLen;step+=0.6)(function(s){
        setTimeout(function(){
          var col2=Math.floor(tx+Math.cos(ang)*s),row2=Math.floor(ty+Math.sin(ang)*s);
          if(col2<0||col2>=COLS||row2<0||row2>=ROWS) return;
          var idx=row2*COLS+col2;
          if(pixHP[idx]<=0||pxMat[idx]===MAT_VOID) return;
          pixHP[idx]-=1.5;
          if(pixHP[idx]<=0){pixHP[idx]=0;pixFire[idx]=0;eraseDecalTile(col2,row2);spawnParts(ox+col2*BLOCK+BLOCK/2,oy+row2*BLOCK+BLOCK/2,pxR[idx],pxG[idx],pxB[idx],"rpg");}
          checkCollapse(col2,row2,3);
        },s*35);
      })(step);
    })(angle,len);
  }
}

// ── FIRE SPREAD TICK ──────────────────────────────────────────
// Full grid scanned each tick for spread (fast — most tiles skip immediately).
// HP damage uses same full scan but is throttled per tick interval.
var lastFireTick=0;

function tickFire(now){
  if(now-lastFireTick<120) return;
  lastFireTick=now;
  if(!pixHP||!pixFire) return;
  var total=COLS*ROWS;
  if(total===0) return;

  var dirs=[[-1,0],[1,0],[0,-1],[0,1]];
  var toIgnite=[];

  for(var idx=0;idx<total;idx++){
    if(pixFire[idx]<=0) continue;
    if(pixHP[idx]<=0){pixFire[idx]=0;continue;}
    if(pxMat[idx]===MAT_VOID){pixFire[idx]=0;continue;}

    var mat=pxMat[idx]||MAT_MISC;
    var resist=getResist(mat,"fire");
    var gasMult = 1 + pixGas[idx]*2;

    // HP damage
    pixHP[idx]-=0.08*(1-resist)*gasMult;

    if(pixHP[idx]<=0){
      pixHP[idx]=0;pixFire[idx]=0;pixGas[idx]=0;
      if(pixBurnout) pixBurnout[idx]=0;
      var col=idx%COLS, row=idx/COLS|0;
      eraseDecalTile(col, row);
      if(Math.random()<0.4) spawnParts(ox+col*BLOCK+BLOCK/2,oy+row*BLOCK+BLOCK/2,pxR[idx],pxG[idx],pxB[idx],"flamethrower");
      if(Math.random()<0.7) spawnSmoke(ox+col*BLOCK+BLOCK/2,oy+row*BLOCK+BLOCK/2);
      checkCollapse(col,row,4);
      continue;
    }

    var fi=pixFire[idx];
    var col=idx%COLS, row=idx/COLS|0;

    // Ongoing smoke from burning tiles — reduced rate for performance
    if(Math.random()<0.015*fi) spawnSmoke(ox+col*BLOCK+BLOCK/2,oy+row*BLOCK+BLOCK/2);

    // Fire spread
    var spreadRoll = pixGas[idx]>0 ? 0.375 : 0.25;
    var numSpread  = pixGas[idx]>0 ? 3 : 1;
    for(var sd=0;sd<numSpread;sd++){
      if(Math.random()<spreadRoll){
        var dir=dirs[Math.floor(Math.random()*4)];
        var nc=col+dir[0],nr=row+dir[1];
        if(nc>=0&&nc<COLS&&nr>=0&&nr<ROWS){
          var nidx=nr*COLS+nc;
          if(pixHP[nidx]>0&&pixFire[nidx]===0&&pxMat[nidx]!==MAT_VOID){
            var nResist=getResist(pxMat[nidx]||MAT_MISC,"fire");
            var nGasBoost = pixGas[nidx]>0 ? 0.9 : 0;
            if(Math.random()>(nResist*0.8-nGasBoost)) toIgnite.push(nidx);
          }
        }
      }
    }

    pixFire[idx]+=0.05; if(pixFire[idx]>1) pixFire[idx]=1;

    // Burnout dynamics
    if(pixBurnout){
      var bo=pixBurnout[idx];
      if(bo>0){
        bo-=0.012+Math.random()*0.008;
        if(bo<0) bo=0;
        if(Math.random()<0.015) bo=Math.max(0,bo-0.25);
        pixBurnout[idx]=bo;
      } else {
        if(Math.random()<0.008*fi) pixBurnout[idx]=0.5+Math.random()*0.5;
      }
    }
  }

  for(var i=0;i<toIgnite.length;i++) pixFire[toIgnite[i]]=0.2+Math.random()*0.3;
  if(toIgnite.length>0) soundFireSpread();
}

// ── COLLAPSE ─────────────────────────────────────────────────
function checkCollapse(cx,cy,scanRad){
  var total=0,dead=0;
  for(var row=Math.max(0,cy-scanRad);row<Math.min(ROWS,cy+scanRad);row++)
    for(var col=Math.max(0,cx-scanRad);col<Math.min(COLS,cx+scanRad);col++){
      total++;if(pixHP[row*COLS+col]<=0)dead++;
    }
  if(total>0&&dead/total>=0.70){
    for(var row2=Math.max(0,cy-scanRad);row2<Math.min(ROWS,cy+scanRad);row2++)
      for(var col2=Math.max(0,cx-scanRad);col2<Math.min(COLS,cx+scanRad);col2++){
        var idx=row2*COLS+col2;
        if(pixHP[idx]<=0||pxMat[idx]===MAT_VOID) continue;
        (function(r2,c2,i2){
          setTimeout(function(){
            if(pixHP[i2]<=0) return;
            pixHP[i2]=0;pixFire[i2]=0;
            eraseDecalTile(c2, r2);
            particles.push({
              x:ox+c2*BLOCK+BLOCK/2,y:oy+r2*BLOCK+BLOCK/2,
              vx:(Math.random()-0.5)*2,vy:-(Math.random()*1),
              life:1,decay:0.012+Math.random()*0.02,
              size:BLOCK*(0.8+Math.random()*0.4),
              r:pxR[i2],g:pxG[i2],b:pxB[i2],falling:true,smoke:false
            });
          },Math.random()*400);
        })(row2,col2,idx);
      }
  }
}

// ── RPG EXPLOSION ANIMATION ───────────────────────────────────
// Uses the three explosion frame PNGs from the manifest:
//   00-explosion-orange-frame.png, 00-explosion-white-frame.png, 00-explosion-yellow-frame.png
// They are cycled rapidly at the impact point, scaled to blast radius.
var rpgExpFrames   = [];
var rpgExpFrameTime = 80;  // ms per frame

function loadRpgExpFrames() {
  var names = [
    "00-explosion-orange-frame.png",
    "00-explosion-white-frame.png",
    "00-explosion-yellow-frame.png",
    "00-explosion-orange-frame.png"   // repeat for tail
  ];
  rpgExpFrames = [];
  names.forEach(function(n){
    var img = new Image();
    img.src = bust(ASSETS + n);
    rpgExpFrames.push(img);
  });
}

// Active explosion instances rendered each frame
var activeExplosions = [];

function triggerRpgExplosion(cx, cy, radTiles) {
  var sizePx = radTiles * BLOCK * 2.2;
  activeExplosions.push({
    cx: cx, cy: cy,
    size: sizePx,
    frame: 0,
    lastTick: 0,
    done: false
  });
}

// Called from render() — draw active RPG explosions on fire canvas
function drawExplosions(now) {
  for (var i = activeExplosions.length-1; i>=0; i--) {
    var exp = activeExplosions[i];
    if (exp.done) { activeExplosions.splice(i,1); continue; }
    if (now - exp.lastTick > rpgExpFrameTime) {
      exp.frame++;
      exp.lastTick = now;
    }
    if (exp.frame >= rpgExpFrames.length) { exp.done=true; continue; }
    var img = rpgExpFrames[exp.frame];
    if (!img || !img.complete || !img.naturalWidth) continue;
    fCtx.save();
    fCtx.globalAlpha = 1.0 - exp.frame / rpgExpFrames.length * 0.3;
    fCtx.drawImage(img,
      exp.cx - exp.size/2,
      exp.cy - exp.size/2,
      exp.size, exp.size);
    fCtx.restore();
  }
}

// ── PARTICLES ────────────────────────────────────────────────
var MAX_PARTICLES = 300;  // hard cap — gameplay over graphics

function spawnParts(x,y,r,g,b,wid){
  var n=(wid==="rpg")?12:wid==="shotgun"?6:3;
  if(particles.length+n > MAX_PARTICLES) return;  // skip if at cap
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,spd=1.5+Math.random()*8;
    particles.push({x:x,y:y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-3,
      life:1,decay:0.022+Math.random()*0.04,size:BLOCK*(0.5+Math.random()*1.2),
      r:r,g:g,b:b,falling:false,smoke:false});
  }
  if(wid==="flamethrower"&&particles.length<MAX_PARTICLES) spawnSmoke(x,y);
}

// Fix 14: smoke with brighter highlights — each puff gets a random
// highlight colour (light grey / warm white) drawn as a smaller inner circle
function spawnSmoke(x,y){
  // Reduced 60% from original — 1-2 puffs instead of 4-7
  var count=1+Math.floor(Math.random()*2);
  for(var i=0;i<count;i++){
    var bright = 90 + Math.floor(Math.random()*90);
    var warm   = Math.floor(Math.random()*30);
    particles.push({
      x:x+(Math.random()-0.5)*10,y:y+(Math.random()-0.5)*4,
      vx:(Math.random()-0.5)*1.2,vy:-(0.6+Math.random()*1.8),
      life:1,decay:0.008+Math.random()*0.012,   // faster decay = shorter lived
      size:10+Math.random()*14,
      r:bright+warm, g:bright, b:bright,
      hlR:Math.min(255,bright+70+warm), hlG:Math.min(255,bright+65), hlB:Math.min(255,bright+65),
      falling:false, smoke:true
    });
  }
}

// ── RENDER ───────────────────────────────────────────────────
var lastRenderTime=0;

function render(now){
  if (paused) return;
  lastRenderTime=now;
  tickFire(now);

  // Advance fire frame animation
  if (now - fireFrameTimer > fireFrameTime) {
    fireFrameTimer = now;
    if (fireFrameImgs.length > 0)
      fireFrameIdx = (fireFrameIdx+1) % fireFrameImgs.length;
  }

  // ── damage canvas (dead tiles = black) ──────────────────────
  dCtx.clearRect(0,0,W,H);

  // ── gas canvas (darkening wetness layer) ────────────────────
  gCtx.clearRect(0,0,W,H);

  // ── fire canvas (animated frames scaled to burning tiles) ───
  fCtx.clearRect(0,0,W,H);

  if(pixHP){
    var curFrame = fireFrameImgs.length>0 ? fireFrameImgs[fireFrameIdx] : null;

    for(var row=0;row<ROWS;row++) for(var col=0;col<COLS;col++){
      var idx=row*COLS+col,hp=pixHP[idx];
      var fi=pixFire[idx];
      var gi=pixGas[idx];
      // Skip tiles with nothing to draw
      if(pxMat[idx]===MAT_VOID) continue;
      if(hp>0 && fi<=0 && gi<=0) continue;

      var bx=ox+col*BLOCK,by=oy+row*BLOCK;

      if(hp<=0){
        // Dead tile — black void
        dCtx.fillStyle="#000"; dCtx.fillRect(bx,by,BLOCK,BLOCK);
      } else {

        // Gas wetness darkening
        if(gi>0){
          gCtx.fillStyle="rgba(40,35,10,"+Math.min(gi*0.55,0.55).toFixed(3)+")";
          gCtx.fillRect(bx,by,BLOCK,BLOCK);
        }

        // Fire — use animated frame image scaled to tile
        if(fi>0 && curFrame && curFrame.complete && curFrame.naturalWidth>0){
          var scale = 1.0 + fi * 1.5;
          var fw = BLOCK * scale * 2;
          var fh = BLOCK * scale * 2.5;
          var fx = bx + BLOCK/2 - fw/2;
          var fy = by + BLOCK - fh * 0.7;
          var bo = (pixBurnout && pixBurnout[idx]) ? pixBurnout[idx] : 0;
          fCtx.globalAlpha = Math.min(fi * 1.1, 1.0) * (1.0 - bo * 0.85);
          fCtx.drawImage(curFrame, fx, fy, fw, fh);
          // Draw dark charred patch when burned out
          if (bo > 0.1) {
            fCtx.globalAlpha = bo * 0.7;
            fCtx.fillStyle = "#090400";
            fCtx.beginPath();
            fCtx.arc(bx+BLOCK/2, by+BLOCK/2, BLOCK*0.7, 0, Math.PI*2);
            fCtx.fill();
          }
        } else if (fi>0) {
          // Fallback: procedural gradient if frames not loaded
          var cx2=bx+BLOCK/2,cy2=by+BLOCK/2;
          var bo2 = (pixBurnout && pixBurnout[idx]) ? pixBurnout[idx] : 0;
          var flicker=0.7+Math.random()*0.3;
          var innerR=Math.min(255,(230+Math.random()*25)*flicker)|0;
          var innerG=Math.min(255,(160+Math.random()*80)*flicker)|0;
          var outerR=Math.min(255,(200+Math.random()*40)*flicker)|0;
          var outerG=Math.min(255,(40+Math.random()*80)*fi*flicker)|0;
          var grad=fCtx.createRadialGradient(cx2,cy2,0,cx2,cy2,BLOCK*0.9);
          grad.addColorStop(0,"rgba("+innerR+","+innerG+",0,"+(fi*0.95*(1-bo2*0.85)).toFixed(2)+")");
          grad.addColorStop(0.5,"rgba("+outerR+","+outerG+",0,"+(fi*0.8*(1-bo2*0.7)).toFixed(2)+")");
          grad.addColorStop(1,"rgba(180,0,0,0)");
          fCtx.fillStyle=grad;
          fCtx.beginPath();
          fCtx.arc(cx2,cy2+(Math.random()*2-1),BLOCK*0.9,0,Math.PI*2);
          fCtx.fill();
          if (bo2 > 0.05) {
            fCtx.save();
            fCtx.globalAlpha = bo2 * 0.75;
            fCtx.fillStyle = "rgb("+(8+Math.random()*10|0)+","+(4+Math.random()*6|0)+",0)";
            fCtx.beginPath();
            fCtx.arc(cx2, cy2, BLOCK*0.7, 0, Math.PI*2);
            fCtx.fill();
            fCtx.restore();
          }
        }
      }
    }
  }
  fCtx.globalAlpha = 1; // reset after fire loop
  if(particles.length > MAX_PARTICLES) particles.splice(0, particles.length - MAX_PARTICLES);
  ptCtx.clearRect(0,0,W,H);
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.x+=p.vx; p.y+=p.vy;
    p.vy+=p.falling?0.5:p.smoke?-0.02:0.3;
    if(p.smoke){p.vx*=0.98;p.size+=0.2;}
    p.life-=p.decay;
    if(p.life<=0){particles.splice(i,1);continue;}
    if(p.smoke){
      var outerR=p.r||75, outerG=p.g||75, outerB=p.b||75;
      var sz=p.size*p.life;
      if(sz<0.5) continue;  // skip invisible
      ptCtx.globalAlpha=p.life*0.35;
      ptCtx.fillStyle="rgb("+outerR+","+outerG+","+outerB+")";
      ptCtx.beginPath(); ptCtx.arc(p.x,p.y,sz,0,Math.PI*2); ptCtx.fill();
    } else {
      ptCtx.globalAlpha=p.life;
      ptCtx.fillStyle="rgb("+p.r+","+p.g+","+p.b+")";
      var s=p.size*p.life; ptCtx.fillRect(p.x-s/2,p.y-s/2,s,s);
    }
  }
  ptCtx.globalAlpha=1;

  // RPG explosion frames drawn on top of fire canvas
  drawExplosions(now);
}

function togglePause() {
  if (!gameOn) return;   // nothing to pause before a photo is in play

    firing = false; resetFtRate(); stopMgFire();
    pauseOverlay.style.display = "flex";

// ── CAMERA ───────────────────────────────────────────────────
function openCam(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showCameraFallback("This browser doesn't support camera access.\nTry Demo Mode below, or open this page in a modern browser.");
    return;
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false})
    .then(gotStream)
    .catch(function(){
      navigator.mediaDevices.getUserMedia({video:true,audio:false})
        .then(gotStream)
        .catch(function(err){
          var msg="No camera found.\nThis game normally uses your webcam.";
          if(err.name==="NotAllowedError"||err.name==="PermissionDeniedError") msg="Camera access blocked.\nAllow it in your browser settings, or try Demo Mode below.";
          else if(err.name==="NotFoundError") msg="No webcam detected.\nThis game normally uses a camera, but you can still try it out below.";
          else if(err.name==="NotReadableError") msg="Camera is in use\nby another app right now.";
          else msg="Camera error: "+err.name;
          showCameraFallback(msg);
        });
    });
}

// Shown whenever the camera can't be reached (no hardware, blocked
// permission, or in use elsewhere) — instead of leaving the player on a
// blank screen, offer a graceful way out plus a no-camera Demo Mode so
// they can still try the game.
function showCameraFallback(msg){
  startScreen.innerHTML =
    "<div style='color:#fff;font-size:16px;text-align:center;padding:24px;line-height:1.5;font-family:sans-serif;max-width:320px'>"+
      "<div style='font-size:42px;margin-bottom:10px'>\ud83d\ude1e</div>"+
      "<div style='margin-bottom:20px;white-space:pre-line'>"+msg+"</div>"+
      "<button id='camFallbackDemo' style='display:block;width:100%;margin-bottom:10px;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.35);background:rgba(255,255,255,0.16);color:#fff;font-size:15px;cursor:pointer;font-family:sans-serif'>Try Demo Mode</button>"+
      "<button id='camFallbackExit' style='display:block;width:100%;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.06);color:#fff;font-size:15px;cursor:pointer;font-family:sans-serif'>Exit</button>"+
    "</div>";
  startScreen.classList.remove("gone");

  var demoBtn = document.getElementById("camFallbackDemo");
  var exitBtn = document.getElementById("camFallbackExit");

  function bindSafe(el, handler){
    el.addEventListener("click", function(e){ e.stopPropagation(); handler(); });
    el.addEventListener("touchend", function(e){ e.preventDefault(); e.stopPropagation(); handler(); }, {passive:false});
  }

  bindSafe(demoBtn, function(){
    startScreen.classList.add("gone");
    hud.style.display = "flex";
    startDemoMode();
  });
  bindSafe(exitBtn, function(){
    // No reliable cross-context way to close a Kongregate-embedded tab,
    // so "Exit" just backs out to the title screen instead of retrying
    // the camera or leaving the player stuck on an error message.
    startScreen.classList.add("gone");
    hud.style.display = "none";
    titleScreen.classList.remove("gone");
  });
}

// Camera-free fallback session: loads a placeholder image (or a manifest-
// configured demo photo) so the player can still try the weapons and
// gameplay loop even without a working webcam.
function startDemoMode(){
  var demoPath = cfgStr("DEMO","image","") || "00-demo-photo.png";
  demoPath = (demoPath.indexOf("/") >= 0) ? demoPath : ASSETS + demoPath;

  function launchWithImage(imgSource){
    photoImg = imgSource;
    photoCvs.classList.add("visible");
    drawPhoto(); buildGrid();
    gameOn=true; particles=[];
    sgBarrel=0; sgReloading=false; sniperReloading=false; rpgReloading=false;
    var ft=WPS.find(function(w){return w.id==="flamethrower";});
    ftCurrentRate=ft?ft.fireRateStart:180;
    hitCvs.classList.add("visible");
    updateCrosshair();
    gameLoop();
    maybeShowFirstCaptureTip();
  }

  var img = new Image();
  img.onload = function(){ launchWithImage(img); };
  img.onerror = function(){
    // No demo asset on disk — generate a simple placeholder canvas instead
    // of failing outright.
    var c = document.createElement("canvas");
    c.width = 900; c.height = 600;
    var cx = c.getContext("2d");
    var grad = cx.createLinearGradient(0,0,900,600);
    grad.addColorStop(0,"#3a4b5c"); grad.addColorStop(1,"#1e2a35");
    cx.fillStyle = grad; cx.fillRect(0,0,900,600);
    cx.fillStyle = "#ffffff";
    cx.font = "32px sans-serif";
    cx.textAlign = "center";
    cx.fillText("Demo Mode", 450, 300);
    cx.font = "18px sans-serif";
    cx.fillStyle = "rgba(255,255,255,0.75)";
    cx.fillText("Blast away — no camera needed!", 450, 340);
    launchWithImage(c);
  };
  img.src = bust(demoPath);
}

function gotStream(stream){
  camVideo.srcObject=stream;
  camVideo.onplaying=function(){btnSnap.disabled=false;camVideo.classList.add("visible");startTutorialIfNeeded();};
  camVideo.oncanplay=function(){if(btnSnap.disabled){btnSnap.disabled=false;camVideo.classList.add("visible");startTutorialIfNeeded();}};

}

// ── ONE-TIME TUTORIAL TIPS ─────────────────────────────────────
// Shows short tips once ever per browser: camera/snap controls, weapon
// controls, then a general tip right after the first photo (or demo mode)
// is captured. Tracked via localStorage so it never shows again.
var tutorialDone = (localStorage.getItem("pb_tutorial_done") === "1");
var _tutorialStep = 0;          // 0=idle, 1=camera tip, 2=weapon tip, 3=first-capture tip
var _firstCaptureTipShown = false;

function _positionTip(anchorEl) {
  tutorialTip.style.transform = "";
  var r = anchorEl.getBoundingClientRect();
  var tw = tutorialTip.offsetWidth, th = tutorialTip.offsetHeight;
  var left = r.left + r.width / 2 - tw / 2;
  left = Math.max(10, Math.min(left, window.innerWidth - tw - 10));
  var top = r.top - th - 14;
  if (top < 10) top = r.bottom + 14;   // flip below anchor if no room above
  tutorialTip.style.left = left + "px";
  tutorialTip.style.top  = top + "px";
}

function showTip(text, anchorEl, step) {
  _tutorialStep = step;
  tutorialTipText.textContent = text;
  tutorialTip.style.display = "block";
  if (anchorEl) {
    _positionTip(anchorEl);
  } else {
    tutorialTip.style.left = "50%";
    tutorialTip.style.top  = "50%";
    tutorialTip.style.transform = "translate(-50%,-50%)";
  }
}

function hideTip() {
  tutorialTip.style.display = "none";
  tutorialTip.style.transform = "";
}

function startTutorialIfNeeded() {
  if (tutorialDone) return;
  showTip("Tap the camera button to snap a photo, or use webcam permissions above.", btnSnap, 1);
}

function maybeShowFirstCaptureTip() {
  if (tutorialDone || _firstCaptureTipShown) return;
  _firstCaptureTipShown = true;
  hideTip();   // clear the camera/weapon tip if the player rushed ahead of it
  showTip("Blast your photo any way you like — enjoy!", null, 3);
}

function finishTutorial() {
  tutorialDone = true;
  localStorage.setItem("pb_tutorial_done", "1");
  _tutorialStep = 0;
}

function _onTutorialDismiss(e) {
  e.preventDefault(); e.stopPropagation();
  var step = _tutorialStep;
  hideTip();
  if (step === 1) {
    showTip("Tap the weapon button to cycle through weapons.", btnWeapon, 2);
  } else if (step === 2) {
    _tutorialStep = 0;   // waits for the first-capture tip next
  } else if (step === 3) {
    finishTutorial();
  }
}
tutorialTipDismiss.addEventListener("click", _onTutorialDismiss);
tutorialTipDismiss.addEventListener("touchend", _onTutorialDismiss, {passive:false});
tutorialTip.addEventListener("click", function(e){ e.stopPropagation(); });

// On manifest load: set title image + camera icon, start preloading music.
// Music auto-plays as soon as it's decoded (title is showing).
// Click/tap on title: enter game. Music fades out.
function setTitleImage() {

  document.getElementById("titleImg").src = bust(path);

}

// Called after manifest loads — starts music without waiting for a user gesture.
// Modern browsers block autoplay; we create an AC on a silent user interaction
// (the page itself loading is enough on most desktop browsers, but on mobile
// we fall back to playing on the first tap gesture via dismissTitle).
function autoStartTitleMusic() {
  // Try immediately (works on desktop/Chrome after a page interaction)
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "running") { startTitleMusic(); return; }
  } catch(e) {}
  // On mobile, AC starts suspended — startTitleMusic is called from dismissTitle instead
}

var _titleDismissing = false;   // guard against double-clicks during the delay

function dismissTitle(){
  if (titleScreen.classList.contains("gone") || _titleDismissing) return;
  _titleDismissing = true;
  // Unlock AC and play music (if not already playing from autoStart)
  getAC();
  startTitleMusic();
  // Let the title loop play briefly, then dismiss the title screen and
  // fade the music out together.
  setTimeout(function(){
    stopTitleMusic();
    titleScreen.classList.add("gone");
    hud.style.display="flex";
    openCam();
    _titleDismissing = false;
  }, 3000);
}

fetch("photo_blaster_manifest.txt?nocache=" + Date.now())
  .then(function(r){
    if(!r.ok) throw new Error("Manifest not found");
    return r.text();
  })
  .then(function(txt){

    loadResistances();
    BLOOD_FLESH_ONLY = cfgStr("EFFECTS","blood_flesh_only","true")==="true";
    BLOCK = Math.max(4, cfgNum("GLOBAL","base_damage_radius_px",16) / 2.67 | 0);
    buildWeapons();
    setWeaponIcon();
    loadBloodImg();
    loadRimImg();
    loadFireFrames();
    loadRpgExpFrames();
    // Set title image and camera icon immediately (cache-busted)
    setTitleImage();
    // Flesh damage sound
    fleshDmgSound = ASSETS + (cfgStr("GLOBAL","flesh-damage","") || "00-flesh-damage.wav");
    fleshDmgVol   = cfgNum("GLOBAL","flesh-damage_volume",0.7);
    FLESH_HIT_MIN_INTERVAL = cfgNum("GLOBAL","flesh_hit_min_interval_ms", 180);
    // Weapon swap sound
    weaponSwapSound = ASSETS + "00-wepon-swap.wav";
    // Preload title music and start playing as soon as decoded
    preloadTitleMusic(function(){ autoStartTitleMusic(); });
    console.log("Photo Blaster 5.0 — manifest loaded OK");
    console.log("Weapons:", WPS.map(function(w){return w.label;}).join(", "));
  })
  .catch(function(err){
    console.warn("Manifest load failed:", err, "— using built-in defaults");
    loadResistances();
    buildWeapons();
    setWeaponIcon();
    loadBloodImg();
    loadRimImg();
    loadFireFrames();
    loadRpgExpFrames();
    fleshDmgSound = ASSETS + "00-flesh-damage.wav";
    fleshDmgVol   = 0.7;
    weaponSwapSound = ASSETS + "00-wepon-swap.wav";
  });

var BLOOD_FLESH_ONLY = true;
</script>
</body>
</html>
